<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#f1f1f3}.ink{fill:#111;font-family:'Noto Serif CJK SC','Songti SC','SimSun',serif}.sans{font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif}.red{fill:#92131a}.line{stroke:#222;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#92131a;stroke-width:2;stroke-dasharray:7 5;fill:none}.box{fill:#fff;stroke:#222;stroke-width:1.6}.redbox{fill:#92131a;stroke:#92131a}.graybox{fill:#6e7071}.darkbox{fill:#2f3430}.label{font-size:27px}.small{font-size:21px}.tiny{font-size:18px}.caption{font-size:17px}.white{fill:#fff}.muted{fill:#555}.em{fill:#e40012;font-weight:800}.nodeTitle{font-size:28px;font-weight:700}.shadow{filter:url(#shadow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".14"/></filter>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="62" y="116" class="ink red" font-size="58" font-weight="800">04.</text>
  <rect x="0" y="146" width="205" height="9" class="red"/>
  <text x="255" y="120" class="ink" font-size="47" font-weight="800">交互符号场的叙事结构</text>
  <line x1="520" y1="101" x2="700" y2="101" stroke="#111" stroke-width="2"/>
  <text x="50" y="196" class="sans muted" font-size="25">数字艺术交互符号场的情感传递结构，可使作品文本突破与亲历者的主客边界，</text>
  <text x="1120" y="196" class="sans em" font-size="27">将叙事内涵投射为动作意向性。</text>

  <rect x="48" y="366" width="190" height="132" class="redbox shadow"/>
  <text x="83" y="416" class="ink white nodeTitle">数字艺术</text><text x="73" y="462" class="ink white nodeTitle">交互符号场</text>
  <rect x="42" y="520" width="205" height="82" class="graybox"/><text x="62" y="553" class="sans white small">巨大的双手</text><text x="62" y="586" class="sans white small">微缩的景观</text>

  <rect x="315" y="319" width="255" height="74" class="box" stroke-dasharray="6 4"/><text x="360" y="366" class="sans label">情节经验结构</text>
  <rect x="315" y="436" width="255" height="74" class="box" stroke-dasharray="6 4"/><text x="360" y="483" class="sans label">情绪感知结构</text>
  <path d="M238 425 C275 425 285 356 315 356" class="line"/><path d="M238 425 C275 425 285 473 315 473" class="line"/>
  <text x="270" y="301" class="sans small">符号场作为叙事材料</text>
  <text x="338" y="291" class="sans em small">提供</text>

  <rect x="663" y="356" width="290" height="122" class="redbox shadow"/>
  <text x="712" y="404" class="ink white nodeTitle">“将来”交互动作</text><text x="724" y="452" class="ink white nodeTitle">的叙事背景</text>
  <path d="M570 356 H663" class="line"/><text x="591" y="342" class="sans red small">提供</text>
  <path d="M570 473 H663" class="line"/><text x="591" y="502" class="sans red small">提供</text>

  <rect x="1042" y="344" width="245" height="146" class="box shadow"/><text x="1090" y="399" class="ink nodeTitle">情感传递</text><text x="1138" y="447" class="ink nodeTitle">结构</text>
  <path d="M953 417 H1042" class="line"/><text x="969" y="395" class="sans small">显露出</text>

  <rect x="1332" y="332" width="214" height="170" class="box" stroke="#92131a" stroke-width="2"/><text x="1360" y="389" class="ink nodeTitle">亲历者的</text><text x="1351" y="437" class="ink nodeTitle">动作意向性</text>
  <path d="M1287 417 H1332" class="line"/><text x="1289" y="386" class="sans red tiny">投射为</text>

  <rect x="1067" y="620" width="275" height="91" class="graybox shadow"/><text x="1096" y="657" class="sans white small">亲历者的动作趋向</text><text x="1121" y="690" class="sans white small">与行为模式</text>
  <path d="M1439 502 V574 C1439 602 1376 666 1342 666" class="line"/><text x="1386" y="583" class="sans small">设定</text>

  <rect x="662" y="628" width="280" height="80" class="box" stroke-dasharray="7 5"/><text x="690" y="678" class="sans small">数字艺术交互命题场</text><text x="756" y="704" class="sans tiny">的存在</text>
  <path d="M1067 666 H942" class="line"/><text x="982" y="648" class="sans red small">指向</text>

  <rect x="50" y="685" width="185" height="54" class="box"/><text x="85" y="720" class="sans small">理论溯源</text>
  <rect x="270" y="670" width="300" height="84" class="box"/><text x="292" y="704" class="sans small">梅洛-庞蒂：表达动作</text><text x="292" y="735" class="sans small">的不同包含情绪本身的不同</text>
  <path d="M235 712 H270" class="line"/><text x="240" y="694" class="sans red tiny">包含</text>

  <rect x="616" y="756" width="660" height="70" class="box" stroke="#92131a" stroke-width="2" stroke-dasharray="8 5"/><text x="647" y="800" class="sans red small">核心：作品文本突破主客边界，将叙事内涵转化为亲历者的动作意向性</text>
  <path d="M801 708 V756" class="line"/>
</svg>
